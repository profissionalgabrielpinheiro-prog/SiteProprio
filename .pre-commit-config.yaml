# Instalar uma vez:  pip install pre-commit && pre-commit install
# Hooks locais (usam as ferramentas do .venv): nenhum código de terceiros é baixado na hora do commit.
repos:
  - repo: local
    hooks:
      - id: bloquear-dados
        name: Dados da empresa e segredos fora do Git
        entry: python scripts/bloquear_dados.py --staged
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff
        name: ruff
        entry: ruff check
        language: system
        types: [python]
      - id: bandit
        name: bandit
        entry: bandit -q -c pyproject.toml -r cupons gerar_site.py scripts
        language: system
        pass_filenames: false
        types: [python]
      - id: gitleaks
        name: gitleaks (se instalado)
        entry: gitleaks protect --staged --redact
        language: system
        pass_filenames: false
