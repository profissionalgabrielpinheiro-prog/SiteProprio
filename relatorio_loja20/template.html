<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="__CSP__">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Loja 20 · Venda × Pesquisa × Economia</title>
<style>
:root{color-scheme:light;--bg:#f4f4f1;--surface:#fcfcfb;--surface-2:#f4f4f1;--ink:#0b0b0b;--ink-2:#52514e;--muted:#76746e;--grid:#e1e0d9;--border:rgba(11,11,11,.10);--hover:rgba(11,11,11,.04);--accent:#2a78d6;--on-accent:#fff;--good:#006300;--bad:#c42f2f;--warn:#8a5a00;--good-bg:rgba(12,163,12,.12);--bad-bg:rgba(208,59,59,.12);--warn-bg:rgba(250,178,25,.22);--info-bg:rgba(42,120,214,.10);--bar:#2a78d6;--bar2:#1baf7a;--bar3:#eb6834;--shadow:0 1px 2px rgba(11,11,11,.05),0 4px 14px rgba(11,11,11,.04)}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0d0d0d;--surface:#1a1a19;--surface-2:#232321;--ink:#f0efec;--ink-2:#c3c2b7;--muted:#9a988f;--grid:#2c2c2a;--border:rgba(255,255,255,.10);--hover:rgba(255,255,255,.05);--accent:#3987e5;--good:#2bc02b;--bad:#e66767;--warn:#f0b43a;--good-bg:rgba(12,163,12,.18);--bad-bg:rgba(230,103,103,.18);--warn-bg:rgba(250,178,25,.16);--info-bg:rgba(57,135,229,.16);--bar:#3987e5;--bar2:#199e70;--bar3:#d95926;--shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,p{margin:0}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:1360px;margin:0 auto;padding:0 20px}
.top{background:var(--surface);border-bottom:1px solid var(--border)}
.top .wrap{padding-top:14px;padding-bottom:14px}
.top h1{font-size:18px;font-weight:650}
.top p{color:var(--ink-2);font-size:12.5px}
.tabs{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
.tab{border:0;background:none;padding:13px 14px;cursor:pointer;color:var(--ink-2);font-weight:550;border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:focus-visible,select:focus-visible,input:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.filters{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;padding:14px 0 2px}
.fg{display:flex;flex-direction:column;gap:5px}
.fg>label,.fg>span.l{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
select,input[type=search],input[type=number]{border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:7px 10px;min-width:160px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:5px 11px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
main{padding:6px 0 60px}
.page{display:none}
.page.on{display:block}
.grid{display:grid;gap:14px;margin-top:14px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:14.5px;font-weight:650}
.card .sub{color:var(--ink-2);font-size:12.5px;margin-top:2px}
.card .body{margin-top:12px}
.kpi .lab{font-size:12px;color:var(--ink-2);font-weight:550}
.kpi .val{font-size:24px;overflow-wrap:anywhere;font-weight:650;letter-spacing:-.02em;margin-top:4px;line-height:1.15}
.kpi .foot{font-size:12px;color:var(--muted);margin-top:4px;min-height:18px}
.tw{overflow:auto;border:1px solid var(--border);border-radius:10px;max-height:560px}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.t th{position:sticky;top:0;background:var(--surface-2);text-align:left;padding:9px 12px;font-weight:600;font-size:12px;color:var(--ink-2);border-bottom:1px solid var(--border);white-space:nowrap;z-index:1}
.t th[data-k]{cursor:pointer;user-select:none}
.t td{padding:8px 12px;border-bottom:1px solid var(--grid);white-space:nowrap}
.t tbody tr:hover td{background:var(--hover)}
.t tr.clk{cursor:pointer}
.t tr.sel td{background:var(--info-bg)}
.t .r{text-align:right}.t th.r{text-align:right}
.t td.w{white-space:normal;min-width:240px;color:var(--ink-2)}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.tag.ok{background:var(--good-bg);color:var(--good)}.tag.bad{background:var(--bad-bg);color:var(--bad)}.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.mut{background:var(--hover);color:var(--ink-2)}
.good{color:var(--good)}.bad{color:var(--bad)}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.alerta{margin:12px 0 0;border:1px solid var(--border);border-left:4px solid var(--warn);background:var(--warn-bg);border-radius:10px;padding:10px 14px;font-size:13px}
.alerta.bad{border-left-color:var(--bad);background:var(--bad-bg)}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:minmax(90px,200px) 1fr 110px;gap:10px;align-items:center;font-size:12.5px}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.bar .tr{background:var(--surface-2);border-radius:5px;height:14px;overflow:hidden}
.bar .fl{height:100%;background:var(--bar);border-radius:5px}
.bar .fl.b2{background:var(--bar2)}.bar .fl.b3{background:var(--bar3)}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
ul.l{margin:8px 0 0;padding-left:18px;color:var(--ink-2);font-size:13px}
ul.l li{margin:3px 0}
.empty{color:var(--muted);padding:18px;text-align:center}
.t tr.g0 td{font-weight:650;background:var(--surface-2)}
.t tr.g1 td{font-weight:600}
.t tr.it td{color:var(--ink-2)}
.tg{display:inline-block;width:18px;color:var(--muted);user-select:none}
.tw.big{max-height:72vh}
.t tfoot td{position:sticky;bottom:0;background:var(--surface-2);font-weight:700;border-top:2px solid var(--border);z-index:1}
</style>
</head>
<body>
<header class="top"><div class="wrap">
<h1>Loja 20 · Venda × Pesquisa × Economia</h1>
<p id="sub"></p>
</div></header>
<nav class="tabs"><div class="wrap" role="tablist" id="tabs"></div></nav>
<main><div class="wrap">
<section class="page" id="p-sim"></section>
<section class="page" id="p-resumo"><p class="note"><b>Resultado da simulação</b> · acompanha os filtros da janela Tabela dinâmica</p><div id="kp-sim" class="grid g-kpi"><div class="empty">Abra a Tabela dinâmica para calcular.</div></div><div id="p-visao"></div><div id="p-perfil"></div></section>
</div></main>
<script type="application/json" id="dados">__DADOS__</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("dados").textContent);
const brl = new Intl.NumberFormat("pt-BR", {style: "currency", currency: "BRL"});
const n0 = new Intl.NumberFormat("pt-BR", {maximumFractionDigits: 0});
const n2 = new Intl.NumberFormat("pt-BR", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const pct = (v, d = 1) => v == null || !isFinite(v) ? "–" : (v * 100).toLocaleString("pt-BR", {minimumFractionDigits: d, maximumFractionDigits: d}) + "%";
const $ = s => document.querySelector(s);

function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const k in props) {
    if (k === "class") e.className = props[k];
    else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), props[k]);
    else e.setAttribute(k, props[k]);
  }
  for (const kid of kids.flat()) { if (kid == null) continue; e.append(kid.nodeType ? kid : document.createTextNode(String(kid))); }
  return e;
}
const tag = (txt, cls) => h("span", {class: "tag " + cls}, txt);
function card(titulo, sub, body) {
  return h("div", {class: "card"}, h("h2", null, titulo), sub ? h("p", {class: "sub"}, sub) : null, h("div", {class: "body"}, body));
}
function kpi(lab, val, foot) {
  return h("div", {class: "card kpi"}, h("div", {class: "lab"}, lab), h("div", {class: "val"}, val), h("div", {class: "foot"}, foot || ""));
}
function bars(itens, cls) {
  const max = Math.max(...itens.map(i => i.v), 1e-9);
  return h("div", {class: "bars"}, itens.map(i => h("div", {class: "bar"},
    h("div", {class: "nm", title: i.nm}, i.nm),
    h("div", {class: "tr"}, h("div", {class: "fl " + (cls || ""), style: "width:" + Math.max(0, i.v / max * 100).toFixed(1) + "%"})),
    h("div", {class: "v"}, i.txt))));
}
// tabela ordenável: cols [{k,label,r,f}], rows [obj]
function tabela(cols, rows, limite, ordemIni, onrow) {
  let sk = ordemIni ? ordemIni[0] : null, sd = ordemIni ? ordemIni[1] : -1;
  const tb = h("tbody"), th = h("tr");
  function pinta() {
    const v = rows.slice();
    if (sk) v.sort((a, b) => { const x = a[sk], y = b[sk]; if (x == null) return 1; if (y == null) return -1; return (typeof x === "string" ? x.localeCompare(y, "pt-BR") : x - y) * sd; });
    tb.replaceChildren();
    if (!v.length) { tb.append(h("tr", null, h("td", {colspan: cols.length, class: "empty"}, "Nenhum registro com os filtros atuais."))); return; }
    for (const r of v.slice(0, limite || 200)) {
      const tr = h("tr", onrow ? {class: "clk", tabindex: "0", onclick: () => onrow(r)} : null, cols.map(c => {
        const val = c.f ? c.f(r[c.k], r) : r[c.k];
        return h("td", {class: (c.r ? "r " : "") + (c.w ? "w" : "")}, val);
      }));
      tb.append(tr);
    }
    if (v.length > (limite || 200)) tb.append(h("tr", null, h("td", {colspan: cols.length, class: "empty"}, "Mostrando " + (limite || 200) + " de " + n0.format(v.length) + " — use os filtros ou a busca para refinar.")));
  }
  for (const c of cols) th.append(h("th", {class: c.r ? "r" : "", "data-k": c.k, tabindex: "0", onclick: () => { if (sk === c.k) sd = -sd; else { sk = c.k; sd = c.r ? -1 : 1; } pinta(); }}, c.label));
  pinta();
  return h("div", {class: "tw"}, h("table", {class: "t"}, h("thead", null, th), tb));
}
function sel(label, opcoes, onch) {
  const s = h("select", {onchange: () => onch(s.value)}, opcoes.map(o => h("option", {value: o[0]}, o[1])));
  return {el: h("div", {class: "fg"}, h("label", null, label), s), s};
}
function chips(label, nomes, ativos, onch) {
  const box = h("div", {class: "chips"});
  nomes.forEach((n, i) => {
    const b = h("button", {class: "chip", type: "button", "aria-pressed": ativos.has(i) ? "true" : "false", onclick: () => {
      if (ativos.has(i)) ativos.delete(i); else ativos.add(i);
      b.setAttribute("aria-pressed", ativos.has(i) ? "true" : "false"); onch();
    }}, n);
    box.append(b);
  });
  return h("div", {class: "fg"}, h("span", {class: "l"}, label), box);
}
function busca(onch) {
  const i = h("input", {type: "search", placeholder: "Buscar produto ou código…", oninput: () => onch(i.value.trim().toLowerCase())});
  return h("div", {class: "fg"}, h("label", null, "Busca"), i);
}

// ---------- dados ----------
const P = D.produtos.map(a => ({id: a[0], nome: a[1], setor: a[2], cat: a[3], cupons: a[4], dias: a[5], unid: a[6], valor: a[7],
  fora: a[8], alto: a[9], pdvVar: a[10], pdvAtac: a[11], custo: a[12]}));
const NC = D.concs.length;
const PC = P.map(() => []);
for (const r of D.pc) PC[r[0]].push({c: r[1], v: r[2], a: r[3], t: r[4], dt: r[5]});

// Moda dos preços (arredondados em centavos); empate = menor preço; sem repetição = mediana.
function moda(vs) {
  const m = new Map();
  for (const v of vs) { const k = Math.round(v * 100); m.set(k, (m.get(k) || 0) + 1); }
  let best = 0, ks = [];
  for (const [k, c] of m) { if (c > best) { best = c; ks = [k]; } else if (c === best) ks.push(k); }
  if (best > 1) return Math.min(...ks) / 100;
  const s = [...vs].sort((a, b) => a - b), n = s.length;
  return n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2;
}
// Preço de referência do mercado para o produto i: considera só preços compatíveis
// (> 0 e dentro de ±compat% do preço do PDV Mateus). crit: "moda" ou "min".
function refMercado(i, ok, crit, compat) {
  const p = P[i], out = {V: NaN, cV: -1, dV: "", A: NaN, cA: -1, dA: ""};
  for (const k of ["V", "A"]) {
    const pdv = k === "V" ? p.pdvVar : p.pdvAtac, cand = [];
    for (const r of PC[i]) {
      if (!ok(r)) continue;
      const v = k === "V" ? r.v : r.a;
      if (!(v > 0)) continue;
      if (compat && pdv > 0 && Math.abs(v / pdv - 1) > compat / 100) continue;
      cand.push({v, c: r.c, dt: r.dt});
    }
    if (!cand.length) continue;
    let ref;
    if (crit === "min") ref = Math.min(...cand.map(x => x.v)); else ref = moda(cand.map(x => x.v));
    let best = cand[0];
    for (const x of cand) if (Math.abs(x.v - ref) < Math.abs(best.v - ref)) best = x;
    out[k] = ref; out["c" + k] = best.c; out["d" + k] = best.dt;
  }
  return out;
}
const CRITERIOS = [["moda", "Moda do mercado (preço mais comum)"], ["min", "Menor preço entre os concorrentes"]];
// linhas de venda em colunas (p = produto, q = quantidade, v = centavos, t = tabela atacado); agrupadas por cupom
const LN = D.linhas, CP = D.cupons, NCUP = CP.id.length;
const LI = new Int32Array(NCUP + 1);
for (let i = 0; i < NCUP; i++) LI[i + 1] = LI[i] + CP.n[i];
const match = (p, q) => !q || p.nome.toLowerCase().includes(q) || String(p.id).includes(q);

$("#sub").textContent = D.perfil.cupons.loja + " · cupons de " + D.perfil.cupons.de + " a " + D.perfil.cupons.ate +
  " · pesquisa de " + D.perfil.pesquisa.de + " a " + D.perfil.pesquisa.ate + " · gerado em " + D.gerado;

// ---------- abas ----------
const ABAS = [["sim", "Tabela dinâmica"], ["resumo", "Resumo e dados"]];
const feito = {};
function abrir(id) {
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.id === id ? "true" : "false"));
  document.querySelectorAll(".page").forEach(p => p.classList.toggle("on", p.id === "p-" + id));
  if (!feito[id]) { feito[id] = true; MONTA[id](); }
  history.replaceState(null, "", "#" + id);
}
for (const [id, nome] of ABAS) $("#tabs").append(h("button", {class: "tab", role: "tab", "data-id": id, onclick: () => abrir(id)}, nome));

const MONTA = {};
MONTA.resumo = () => { MONTA.visao(); MONTA.perfil(); };

// ================= VISÃO GERAL =================
MONTA.visao = () => {
  const pg = $("#p-visao"), pf = D.perfil, tot = P.reduce((s, p) => s + p.valor, 0);
  const dentro = P.filter(p => !p.fora), vdentro = dentro.reduce((s, p) => s + p.valor, 0);
  pg.append(h("div", {class: "grid g-kpi"},
    kpi("Cupons distintos", n0.format(pf.cupons.cupons), pf.cupons.dias + " dias · " + pf.cupons.pdvs + " PDVs"),
    kpi("Produtos vendidos", n0.format(P.length), "ids distintos nos cupons"),
    kpi("Dentro da pesquisa", pct(dentro.length / P.length), n0.format(dentro.length) + " produtos"),
    kpi("Valor dentro da pesquisa", pct(vdentro / tot), brl.format(vdentro) + " de " + brl.format(tot)),
    kpi("Alto giro", n0.format(P.filter(p => p.alto).length), "≥ " + D.cfg.min_dias + " dias e ≥ " + D.cfg.min_cupons + " cupons")));

  const rel = [["561 - Cupons[id_produto_num]", "dim_produto[id_produto]", "muitos → um"], ["1067 - Loja 20[id_produto_num]", "dim_produto[id_produto]", "muitos → um"]];
  pg.append(h("div", {class: "grid g-2"},
    card("1. Relações criadas", "Cupons e pesquisa ficam ligados pela dimensão de produtos (modelo em estrela).", [
      tabela([{k: "a", label: "De"}, {k: "b", label: "Para"}, {k: "c", label: "Cardinalidade"}], rel.map(r => ({a: r[0], b: r[1], c: r[2]}))),
      h("p", {class: "note"}, "O id_produto é texto nos fatos e número em dim_produto. Foi criada a coluna oculta id_produto_num (VALUE do texto) em cada fato. A tabela de cupons agora vem do arquivo cupom - 20 (id_cupom, dia, PDV, id_produto, quantidade e valor) e ocupa o lugar da antiga 561 - Cupons, mantendo os mesmos nomes de coluna para as medidas. Só essa tabela foi recarregada (refresh Full da tabela); o resto do modelo só recebeu Calculate.")]),
    card("2. Validação modelo × Python", "Os mesmos números calculados pelas medidas do Power BI e recalculados do CSV.",
      tabela([{k: "medida", label: "Medida"}, {k: "modelo", label: "Modelo", r: 1, f: v => n2.format(v)}, {k: "python", label: "Python", r: 1, f: v => n2.format(v)},
        {k: "ok", label: "Status", f: v => v ? tag("confere", "ok") : tag("diverge", "bad")}], D.validacao))));

  const alertas = [];
  alertas.push(h("div", {class: "alerta bad"}, h("b", null, "Colunas de preço da 1067 no modelo estão ×100. "),
    "Em '1067 - Loja 20' as colunas Vlr. Varejo PDV, Vlr.Vare.Conc, CustoMedio etc. são Int64 e o arquivo usa ponto decimal: 17,99 vira 1799. Nenhuma medida de preço foi criada em cima delas. Este relatório lê o CSV direto (ponto decimal). Para usar preço no Power BI, a etapa 'Tipo Alterado' precisa converter com cultura en-US para decimal."));
  if (pf.cupons.qtd_zero > 0) alertas.push(h("div", {class: "alerta"}, h("b", null, pf.cupons.qtd_zero + " linhas de cupom têm quantidade 0"),
    " (valor de " + brl.format(pf.cupons.qtd_zero_valor) + "). Entram no valor vendido, mas não têm preço unitário e ficam fora da comparação de preços."));
  alertas.push(h("div", {class: "alerta"}, h("b", null, "Períodos diferentes. "),
    "As vendas (cupons) vão de " + pf.cupons.de + " a " + pf.cupons.ate + " e a pesquisa de preços de " + pf.pesquisa.de + " a " + pf.pesquisa.ate +
    ". O preço do concorrente é o da pesquisa mais recente, aplicado às vendas do período anterior: a economia é uma simulação com preços atuais, não o preço do dia da venda."));
  alertas.push(h("div", {class: "alerta"}, h("b", null, "Produtos sem preço de referência. "),
    n0.format(P.filter(p => p.fora).length) + " produtos vendidos não têm linha na pesquisa (" + pct(1 - vdentro / tot) + " do valor): ficam fora do cálculo de economia."));
  pg.append(alertas);
};

// ================= PERFIL =================
MONTA.perfil = () => {
  const pg = $("#p-perfil"), pf = D.perfil, c = pf.cupons, q = pf.pesquisa, pr = pf.precos;
  pg.append(h("div", {class: "grid g-kpi"},
    kpi("Linhas de cupom", n0.format(c.linhas), "1 linha = 1 produto em 1 cupom"),
    kpi("Linhas da pesquisa", n0.format(q.linhas), n0.format(q.produtos) + " produtos · " + q.datas + " datas"),
    kpi("Concorrentes", q.concorrentes, q.filiais_concorrentes + " filiais"),
    kpi("Preço cupom ÷ PDV (mediana)", pct(pr.cupom_sobre_pdv_mediana), n0.format(pr.linhas_comparaveis) + " linhas comparáveis")));
  const ok = (cond) => cond ? tag("ok", "ok") : tag("atenção", "warn");
  const quali = [
    ["Duplicados cupom × produto", n0.format(c.duplicados_cupom_produto), c.duplicados_cupom_produto === 0, "Cada cupom tem o produto uma vez."],
    ["id_produto nulo", n0.format(c.nulos_id_produto), c.nulos_id_produto === 0, "Chave de ligação completa."],
    ["Quantidade ≤ 0", n0.format(c.qtd_zero), c.qtd_zero === 0, "Sem preço unitário; fora da análise de preço."],
    ["Linhas com preço fora de ±50% do PDV", n0.format(pr.linhas_fora_50pct), pr.linhas_fora_50pct === 0, "Provável unidade diferente (caixa × unidade). Filtro no simulador."],
    ["Preços de concorrente fora de ±50% do PDV", n0.format(pr.conc_incompativeis) + " de " + n0.format(pr.conc_precos) + " (" + pct(pr.conc_incompativeis / pr.conc_precos, 1) + ")", pr.conc_incompativeis === 0, "Descartados do preço de mercado (faixa ajustável no simulador). Preços zerados: " + n0.format(pr.conc_zerados) + "."],
    ["Preço PDV varejo = atacado", n0.format(pr.produtos_pdv_igual_atacado) + " produtos", true, "Nesses a tabela de preço não influencia."],
    ["Linhas vendidas no preço de atacado", n0.format(pr.linhas_tier_atacado), true, "Comparadas ao preço de atacado do concorrente (modo automático)."],
    ["Valores de PESQUISA", q.valores_pesquisa.join(", "), q.valores_pesquisa.length > 1, "Só existe 'COM PESQUISA': fora da pesquisa = sem linha na 1067."],
    ["Lojas nos cupons", String(c.lojas), c.lojas > 1, "Análise de uma única loja."]];
  pg.append(h("div", {class: "grid"}, card("Qualidade dos dados", "O que foi verificado antes de calcular preço e economia.",
    tabela([{k: "a", label: "Verificação"}, {k: "b", label: "Resultado", r: 1}, {k: "s", label: "Status"}, {k: "d", label: "Comentário", w: 1}],
      quali.map(r => ({a: r[0], b: r[1], s: r[2] ? tag("ok", "ok") : tag("atenção", "warn"), d: r[3]}))))));
  pg.append(h("div", {class: "grid g-2"},
    card("Concorrentes pesquisados", "Produtos distintos pesquisados em cada concorrente.", bars(pf.concorrentes.map(x => ({nm: x.nome, v: x.produtos, txt: n0.format(x.produtos)})))),
    card("Tipo de preço do concorrente", "Linhas da pesquisa por tipo.", bars(pf.tipos.map(x => ({nm: x.nome, v: x.linhas, txt: n0.format(x.linhas)})), "b3")),
    card("Linhas de pesquisa por dia", "Cobertura da pesquisa no tempo.", bars(pf.cobertura_pesquisa_dias.map(x => ({nm: x.data, v: x.linhas, txt: n0.format(x.linhas)})), "b2"))));
};

// ================= SIMULADOR: UMA TABELA DINÂMICA (cupom → produtos) =================
MONTA.sim = () => {
  const pg = $("#p-sim");
  const PV = Float64Array.from(P, p => p.pdvVar == null ? NaN : p.pdvVar);
  const sinal = v => (v > 0.005 ? "+" : v < -0.005 ? "−" : "") + brl.format(Math.abs(v));
  const cls = v => v > 0.005 ? "good" : v < -0.005 ? "bad" : "";
  const qtdf = q => q % 1 ? q.toLocaleString("pt-BR", {maximumFractionDigits: 3}) : n0.format(q);
  const pdvs = [...new Set(CP.pdv)].sort((a, b) => a - b);
  const f = {conc: new Set(D.concs.map((_, i) => i)), tipo: new Set(D.tipos.map((_, i) => i)), crit: "moda", modo: "auto",
    compat: 50, desvio: 50, cob: 0, dia: "", pdv: "", q: "", grupo: "cup", ordem: "eco", ver: "todos"};
  const aberto = new Set();
  let limite = 100, S = null;
  let RV = null, RA = null, RCV = null, RCA = null, RDV = null, RDA = null, rPc = 0, rAt = false, rCc = -1, rDt = "";

  const kp = $("#kp-sim"), tw = h("div", {class: "grid"}), aviso = h("div");
  const slider = (min, max, step, val, fmt, onch) => {
    const lab = h("span", {class: "note"}, fmt(val));
    const inp = h("input", {type: "range", min, max, step, value: val, oninput: () => { lab.textContent = fmt(+inp.value); onch(+inp.value); }});
    return [inp, lab];
  };
  const [sCompat, lCompat] = slider(0, 100, 5, 50, v => v ? "±" + v + "%" : "sem filtro", v => { f.compat = v; draw(); });
  const [sDes, lDes] = slider(0, 200, 5, 50, v => v ? "±" + v + "%" : "sem filtro", v => { f.desvio = v; draw(); });
  const [sCob, lCob] = slider(0, 100, 5, 0, v => "≥ " + v + "%", v => { f.cob = v; draw(); });
  const qin = h("input", {type: "search", placeholder: "Nº do cupom ou produto…", oninput: () => { f.q = qin.value.trim().toLowerCase(); limite = 100; draw(); }});

  pg.append(h("div", {class: "filters"},
    chips("Concorrentes considerados", D.concs, f.conc, draw),
    chips("Tipo de preço do concorrente", D.tipos, f.tipo, draw)));
  pg.append(h("div", {class: "filters"},
    sel("Preço do mercado", CRITERIOS, v => { f.crit = v; draw(); }).el,
    sel("Tabela de preço", [["auto", "Automática (conforme a venda)"], ["var", "Sempre varejo"], ["atac", "Sempre atacado"]], v => { f.modo = v; draw(); }).el,
    sel("Agrupar", [["cup", "Cupom → Produtos"], ["dia", "Dia → Cupom → Produtos"]], v => { f.grupo = v; limite = 100; draw(); }).el,
    sel("Ordenar por", [["eco", "Melhor resultado do Mateus (+)"], ["pior", "Pior resultado do Mateus (−)"], ["valor", "Maior valor do cupom"], ["cupom", "Cupom / dia"]], v => { f.ordem = v; draw(); }).el,
    sel("Mostrar", [["todos", "Todos os cupons"], ["pos", "Só onde o Mateus foi mais barato (+)"], ["neg", "Só onde o Mateus foi mais caro (−)"]], v => { f.ver = v; limite = 100; draw(); }).el,
    sel("Dia", [["", "Todos os dias"], ...D.dias.map((d, i) => [String(i), d])], v => { f.dia = v; limite = 100; draw(); }).el,
    sel("PDV", [["", "Todos os PDVs"], ...pdvs.map(x => [String(x), String(x)])], v => { f.pdv = v; limite = 100; draw(); }).el));
  pg.append(h("div", {class: "filters"},
    h("div", {class: "fg"}, h("label", null, "Preço do concorrente compatível com o PDV em"), sCompat, lCompat),
    h("div", {class: "fg"}, h("label", null, "Ignorar itens vendidos fora de"), sDes, lDes),
    h("div", {class: "fg"}, h("label", null, "Cobertura mínima do cupom"), sCob, lCob),
    h("div", {class: "fg"}, h("label", null, "Busca"), qin),
    h("div", {class: "fg"}, h("span", {class: "l"}, "Linhas"),
      h("div", {class: "chips"},
        h("button", {class: "chip", type: "button", onclick: () => { expandir(true); }}, "Expandir tudo"),
        h("button", {class: "chip", type: "button", onclick: () => { aberto.clear(); render(); }}, "Recolher tudo")))));
  pg.append(aviso, tw);
  pg.append(h("p", {class: "note"}, "Como ler: cada cupom mostra a nossa venda, quanto aquela mesma compra custaria no concorrente e a economia = venda no concorrente − nossa venda. Valor positivo (+, verde) = o Mateus foi mais barato; negativo (−, vermelho) = o Mateus foi mais caro que o concorrente. O preço do concorrente é a moda do mercado (preço mais comum entre os concorrentes selecionados; se nenhum se repete, a mediana) ou o menor preço, à sua escolha. Preços de concorrente ≤ 0 ou fora da faixa de compatibilidade com o preço do PDV Mateus são descartados. Produtos sem pesquisa, com pesquisa em branco (sem preço do concorrente) ou vendidos fora da faixa de preço não aparecem no cupom e não entram no cálculo: os valores do cupom são só dos itens comparados. Cada item mostra o concorrente cujo preço foi usado (o mais próximo da referência do mercado) e a data da pesquisa. Cobertura = % do valor do cupom que pôde ser comparado (use o filtro Cobertura mínima para esconder cupons pouco comparados). A linha TOTAL GERAL, fixa no rodapé da tabela, soma todos os cupons filtrados."));

  // 0 = comparado; 1 = fora da pesquisa; 2 = preço vendido fora da faixa; 3 = concorrente sem preço
  function avalia(k) {
    const pi = LN.p[k], pv = PV[pi];
    if (!(pv > 0)) return 1;
    const v = LN.v[k] / 100, preco = v / LN.q[k];
    if (f.desvio && Math.abs(preco / pv - 1) > f.desvio / 100) return 2;
    const at = f.modo === "auto" ? LN.t[k] === 1 : f.modo === "atac";
    const pc = at ? RA[pi] : RV[pi];
    if (!(pc > 0)) return 3;
    rPc = pc; rAt = at; rCc = at ? RCA[pi] : RCV[pi]; rDt = at ? RDA[pi] : RDV[pi]; return 0;
  }

  function draw() {
    RV = new Float64Array(P.length).fill(NaN); RA = new Float64Array(P.length).fill(NaN);
    RCV = new Int16Array(P.length).fill(-1); RCA = new Int16Array(P.length).fill(-1); RDV = new Array(P.length).fill(""); RDA = new Array(P.length).fill("");
    for (let i = 0; i < P.length; i++) {
      if (!PC[i].length) continue;
      const m = refMercado(i, r => f.conc.has(r.c) && f.tipo.has(r.t), f.crit, f.compat);
      RV[i] = m.V; RA[i] = m.A; RCV[i] = m.cV; RCA[i] = m.cA; RDV[i] = m.dV; RDA[i] = m.dA;
    }
    const cPago = new Float64Array(NCUP), cConc = new Float64Array(NCUP), cPos = new Float64Array(NCUP), cNeg = new Float64Array(NCUP), cNc = new Int32Array(NCUP);
    for (let ci = 0; ci < NCUP; ci++) {
      for (let k = LI[ci], e = LI[ci + 1]; k < e; k++) {
        if (avalia(k) !== 0) continue;
        const v = LN.v[k] / 100, c = rPc * LN.q[k], d = c - v;
        cNc[ci]++; cPago[ci] += v; cConc[ci] += c;
        if (d > 0) cPos[ci] += d; else cNeg[ci] += d;
      }
    }
    const pm = f.q ? P.map(p => match(p, f.q)) : null, idx = [];
    for (let ci = 0; ci < NCUP; ci++) {
      if (!cNc[ci]) continue;
      if (f.dia !== "" && CP.d[ci] !== +f.dia) continue;
      if (f.pdv !== "" && CP.pdv[ci] !== +f.pdv) continue;
      const valor = CP.v[ci] / 100;
      if (cPago[ci] / valor < f.cob / 100 - 1e-9) continue;
      const dif = cConc[ci] - cPago[ci];
      if (f.ver === "pos" && !(dif > 0.005)) continue;
      if (f.ver === "neg" && !(dif < -0.005)) continue;
      if (pm && !String(CP.id[ci]).includes(f.q)) {
        let achou = false;
        for (let k = LI[ci], e = LI[ci + 1]; k < e; k++) if (pm[LN.p[k]]) { achou = true; break; }
        if (!achou) continue;
      }
      idx.push(ci);
    }
    const dif = ci => cConc[ci] - cPago[ci], val = ci => cPago[ci];
    const cmp = {eco: (a, b) => dif(b) - dif(a), pior: (a, b) => dif(a) - dif(b), valor: (a, b) => val(b) - val(a), cupom: (a, b) => a - b};
    idx.sort(cmp[f.ordem]);
    let tv = 0, td = 0, tp = 0, tn = 0, com = 0, sem = 0;
    for (const ci of idx) { tv += val(ci); td += dif(ci); tp += cPos[ci]; tn += cNeg[ci]; if (dif(ci) > 0.005) com++; else if (dif(ci) < -0.005) sem++; }
    S = {idx, cPago, cConc, cNc, dif, val};
    aviso.replaceChildren(...(f.conc.size === 0 ? [h("div", {class: "alerta bad"}, "Selecione ao menos um concorrente.")] : []));
    let full = 0, nitC = 0;
    for (const ci of idx) { full += CP.v[ci] / 100; nitC += cNc[ci]; }
    S.tot = {tv, td, n: idx.length, full, nitC};
    kp.replaceChildren(
      kpi("Cupons analisados", n0.format(idx.length), "de " + n0.format(NCUP) + " (cobertura ≥ " + f.cob + "%)"),
      kpi("Nossa venda (itens pesquisados)", brl.format(tv), "ticket médio " + brl.format(idx.length ? tv / idx.length : 0)),
      kpi("Venda no concorrente (est.)", brl.format(tv + td), (f.crit === "moda" ? "moda do mercado" : "menor preço") + " · só itens com pesquisa"),
      kpi("Economia líquida", h("span", {class: cls(td)}, sinal(td)), td > 0 ? "Mateus mais barato em " + pct(tv ? td / tv : null) : "concorrente mais barato em " + pct(tv ? -td / tv : null)),
      kpi("Cupons com Mateus mais barato (+)", pct(idx.length ? com / idx.length : null), n0.format(com) + " cupons · " + n0.format(sem) + " com Mateus mais caro (−)"),
      kpi("Por item", h("span", null, h("span", {class: "good"}, sinal(tp)), " / ", h("span", {class: "bad"}, sinal(tn))), "soma dos itens positivos / negativos"));
    render();
  }

  function expandir() {
    const topo = S.idx.slice(0, limite);
    if (f.grupo === "dia") for (const g of grupos(topo)) { aberto.add("d:" + g.d); for (const ci of g.cs) aberto.add("c:" + ci); }
    else for (const ci of topo) aberto.add("c:" + ci);
    render();
  }

  function grupos(idx) {
    const m = new Map();
    for (const ci of idx) { const d = CP.d[ci]; if (!m.has(d)) m.set(d, {d, cs: [], v: 0, df: 0}); const g = m.get(d); g.cs.push(ci); g.v += S.val(ci); g.df += S.dif(ci); }
    const gs = [...m.values()];
    const o = {eco: (a, b) => b.df - a.df, pior: (a, b) => a.df - b.df, valor: (a, b) => b.v - a.v, cupom: (a, b) => a.d - b.d};
    return gs.sort(o[f.ordem]);
  }

  const celula = (txt, r, extra) => h("td", {class: (r ? "r " : "") + (extra || "")}, txt);
  function linha(nivel, chave, rotulo, qtd, pu, puc, cnome, cdata, nossa, conc, eco, pc, obs, cl) {
    const tg = chave ? h("span", {class: "tg", role: "button", tabindex: "0", "aria-expanded": aberto.has(chave) ? "true" : "false"}, aberto.has(chave) ? "▼" : "▶") : h("span", {class: "tg"}, "");
    const tr = h("tr", {class: cl + (chave ? " clk" : "")},
      h("td", {style: "padding-left:" + (12 + nivel * 20) + "px"}, tg, rotulo),
      celula(qtd, 1), celula(pu, 1), celula(puc, 1), celula(cnome, 0), celula(cdata, 0), celula(nossa, 1), celula(conc, 1),
      celula(eco == null ? "" : h("span", {class: cls(eco)}, sinal(eco)), 1), celula(pc == null ? "" : h("span", {class: cls(eco)}, pct(pc)), 1), celula(obs, 0));
    if (chave) {
      const alt = () => { if (aberto.has(chave)) aberto.delete(chave); else aberto.add(chave); render(); };
      tr.addEventListener("click", alt);
      tr.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); alt(); } });
    }
    return tr;
  }

  function linhasCupom(ci, nivel, tb) {
    const valor = S.val(ci), dif = S.dif(ci), cob = S.cPago[ci] / (CP.v[ci] / 100);
    tb.append(linha(nivel, "c:" + ci, "Cupom " + CP.id[ci] + " · " + D.dias[CP.d[ci]] + " · PDV " + CP.pdv[ci], S.cNc[ci] + (S.cNc[ci] === 1 ? " item" : " itens"), null, null, "", "",
      brl.format(valor), brl.format(valor + dif), dif, valor ? dif / valor : null, tag("cobertura " + pct(cob, 0), cob >= 0.8 ? "ok" : "mut"), "g" + (nivel ? 1 : 0)));
    if (!aberto.has("c:" + ci)) return;
    const it = [];
    for (let k = LI[ci], e = LI[ci + 1]; k < e; k++) {
      if (avalia(k) !== 0) continue;                      // sem pesquisa / pesquisa em branco: o produto não entra no cupom
      const p = P[LN.p[k]], q = LN.q[k], v = LN.v[k] / 100, conc = rPc * q;
      it.push({nome: p.id + " · " + p.nome, q, pu: v / q, v, pc: rPc, conc, eco: conc - v, at: rAt, cn: rCc >= 0 ? D.concs[rCc] : "", dt: rDt});
    }
    it.sort((a, b) => b.eco - a.eco);
    for (const o of it) {
      tb.append(linha(nivel + 1, null, o.nome, qtdf(o.q), n2.format(o.pu), n2.format(o.pc), o.cn, o.dt, brl.format(o.v), brl.format(o.conc), o.eco,
        o.v ? o.eco / o.v : null, tag(o.at ? "atacado" : "varejo", "mut"), "it"));
    }
  }

  function render() {
    const tb = h("tbody"), idx = S.idx;
    const cab = ["Cupom / Produto", "Qtd", "Preço unit. Mateus", "Preço unit. concorrente", "Concorrente", "Data da pesquisa", "Nossa venda", "Venda no concorrente", "Economia (+/−)", "%", "Tabela de preço"];
    const th = h("tr", null, cab.map((c, i) => h("th", {class: [1, 2, 3, 6, 7, 8, 9].includes(i) ? "r" : ""}, c)));
    let mostrados = 0;
    if (!idx.length) tb.append(h("tr", null, h("td", {colspan: cab.length, class: "empty"}, "Nenhum cupom com os filtros atuais.")));
    else if (f.grupo === "cup") {
      for (const ci of idx.slice(0, limite)) { linhasCupom(ci, 0, tb); mostrados++; }
    } else {
      const gs = grupos(idx);
      for (const g of gs.slice(0, limite)) {
        mostrados++;
        tb.append(linha(0, "d:" + g.d, "Dia " + D.dias[g.d], n0.format(g.cs.length) + " cupons", null, null, "", "", brl.format(g.v), brl.format(g.v + g.df), g.df, g.v ? g.df / g.v : null, "", "g0"));
        if (aberto.has("d:" + g.d)) for (const ci of g.cs.slice(0, limite)) linhasCupom(ci, 1, tb);
      }
    }
    const total = f.grupo === "cup" ? idx.length : grupos(idx).length;
    const mais = total > limite ? h("div", {class: "note"}, "Mostrando " + n0.format(mostrados) + " de " + n0.format(total) + (f.grupo === "cup" ? " cupons" : " dias") + ". ",
      h("button", {class: "chip", type: "button", onclick: () => { limite += 100; render(); }}, "Mostrar mais 100")) : null;
    const T = S.tot, tf = h("tfoot", null, linha(0, null, "TOTAL GERAL · " + n0.format(T.n) + " cupons", n0.format(T.nitC) + " itens", null, null, "", "",
      brl.format(T.tv), brl.format(T.tv + T.td), T.td, T.tv ? T.td / T.tv : null, tag("cobertura " + pct(T.full ? T.tv / T.full : null, 0), "mut"), "tot"));
    tw.replaceChildren(card("Cupom → Produtos", "Clique numa linha para abrir o cupom e ver item a item. Ordenado conforme o filtro “Ordenar por”.",
      [h("div", {class: "tw big"}, h("table", {class: "t"}, h("thead", null, th), tb, tf)), mais]));
  }
  draw();
};


abrir(ABAS.some(a => a[0] === location.hash.slice(1)) ? location.hash.slice(1) : "sim");
