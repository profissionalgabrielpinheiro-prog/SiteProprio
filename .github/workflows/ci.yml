name: CI

on:
  push:
    branches: [main]
  pull_request:

# Permissão mínima: a CI só lê o código. Nada aqui publica, escreve ou acessa segredos.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      # Actions travadas pelo hash do commit (a tag pode ser movida por quem comprometer o repositório da action).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Instalar dependências (hash obrigatório)
        run: python -m pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff, inclui regras de segurança)
        run: ruff check .
      - name: Testes, incluindo o ataque XSS no navegador (Chrome do runner)
        run: pytest
