<style>

<body>
<header class="top"><div class="wrap">
<div><h1>Filiais Mix · Venda × Pesquisa × Economia</h1>
<p id="sub"></p></div>
<button id="tema" class="chip ib" type="button" aria-label="Alternar modo escuro" title="Alternar modo escuro">☾</button>
</div></header>
<nav class="tabs"><div class="wrap" role="tablist" id="tabs"></div></nav>
<main><div class="wrap">
<section class="page" id="p-sim"></section>
<section class="page" id="p-resumo"><p class="note"><b>Resultado da simulação</b> · acompanha os filtros da janela Tabela dinâmica</p><div id="kp-sim" class="grid g-kpi"><div class="empty">Abra a Tabela dinâmica para calcular.</div></div><div id="p-cat"></div><div id="p-visao"></div><div id="p-perfil"></div></section>
</div></main>
<script type="application/json" id="dados">__DADOS__</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("dados").textContent);
const brl = new Intl.NumberFormat("pt-BR", {style: "currency", currency: "BRL"});
const n0 = new Intl.NumberFormat("pt-BR", {maximumFractionDigits: 0});
const n2 = new Intl.NumberFormat("pt-BR", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const pct = (v, d = 1) => v == null || !isFinite(v) ? "–" : (v * 100).toLocaleString("pt-BR", {minimumFractionDigits: d, maximumFractionDigits: d}) + "%";
const $ = s => document.querySelector(s);

// ---------- tema claro / escuro ----------
const raiz = document.documentElement;
try { const t0 = localStorage.getItem("tema"); if (t0 === "claro" || t0 === "escuro") raiz.dataset.tema = t0; } catch (_) {}
const temaAtual = () => raiz.dataset.tema || (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "escuro" : "claro");
function aplicaTema(t, grava) {
  raiz.dataset.tema = t;
  if (grava) { try { localStorage.setItem("tema", t); } catch (_) {} }
  const bt = $("#tema");
  bt.textContent = t === "escuro" ? "☀" : "☾";
  bt.title = t === "escuro" ? "Mudar para o modo claro" : "Mudar para o modo escuro";
  bt.setAttribute("aria-label", bt.title);
}
$("#tema").addEventListener("click", () => aplicaTema(temaAtual() === "escuro" ? "claro" : "escuro", true));
aplicaTema(temaAtual(), false);

function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const k in props) {
    if (k === "class") e.className = props[k];
    else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), props[k]);
    else e.setAttribute(k, props[k]);
  }
  for (const kid of kids.flat()) { if (kid == null) continue; e.append(kid.nodeType ? kid : document.createTextNode(String(kid))); }
  return e;
}
const tag = (txt, cls) => h("span", {class: "tag " + cls}, txt);
function card(titulo, sub, body) {
  return h("div", {class: "card"}, h("h2", null, titulo), sub ? h("p", {class: "sub"}, sub) : null, h("div", {class: "body"}, body));
}
function kpi(lab, val, foot) {
  return h("div", {class: "card kpi"}, h("div", {class: "lab"}, lab), h("div", {class: "val"}, val), h("div", {class: "foot"}, foot || ""));
}
function bars(itens, cls) {
  const max = Math.max(...itens.map(i => i.v), 1e-9);
  return h("div", {class: "bars"}, itens.map(i => h("div", {class: "bar"},
    h("div", {class: "nm", title: i.nm}, i.nm),
    h("div", {class: "tr"}, h("div", {class: "fl " + (cls || ""), style: "width:" + Math.max(0, i.v / max * 100).toFixed(1) + "%"})),
    h("div", {class: "v"}, i.txt))));
}
// tabela ordenável: cols [{k,label,r,f}], rows [obj]
function tabela(cols, rows, limite, ordemIni, onrow) {
  let sk = ordemIni ? ordemIni[0] : null, sd = ordemIni ? ordemIni[1] : -1;
  const tb = h("tbody"), th = h("tr");
  function pinta() {
    const v = rows.slice();
    if (sk) v.sort((a, b) => { const x = a[sk], y = b[sk]; if (x == null) return 1; if (y == null) return -1; return (typeof x === "string" ? x.localeCompare(y, "pt-BR") : x - y) * sd; });
    tb.replaceChildren();
    if (!v.length) { tb.append(h("tr", null, h("td", {colspan: cols.length, class: "empty"}, "Nenhum registro com os filtros atuais."))); return; }
    for (const r of v.slice(0, limite || 200)) {
      const tr = h("tr", onrow ? {class: "clk", tabindex: "0", onclick: () => onrow(r)} : null, cols.map(c => {
        const val = c.f ? c.f(r[c.k], r) : r[c.k];
        return h("td", {class: (c.r ? "r " : "") + (c.w ? "w" : "")}, val);
      }));
      tb.append(tr);
    }
    if (v.length > (limite || 200)) tb.append(h("tr", null, h("td", {colspan: cols.length, class: "empty"}, "Mostrando " + (limite || 200) + " de " + n0.format(v.length) + " — use os filtros ou a busca para refinar.")));
  }
  for (const c of cols) th.append(h("th", {class: c.r ? "r" : "", "data-k": c.k, tabindex: "0", onclick: () => { if (sk === c.k) sd = -sd; else { sk = c.k; sd = c.r ? -1 : 1; } pinta(); }}, c.label));
  pinta();
  return h("div", {class: "tw"}, h("table", {class: "t"}, h("thead", null, th), tb));
}
function sel(label, opcoes, onch) {
  const s = h("select", {onchange: () => onch(s.value)}, opcoes.map(o => h("option", {value: o[0]}, o[1])));
  return {el: h("div", {class: "fg"}, h("label", null, label), s), s};
}
function chips(label, nomes, ativos, onch) {
  const box = h("div", {class: "chips"});
  nomes.forEach((n, i) => {
    const b = h("button", {class: "chip", type: "button", "aria-pressed": ativos.has(i) ? "true" : "false", onclick: () => {
      if (ativos.has(i)) ativos.delete(i); else ativos.add(i);
      b.setAttribute("aria-pressed", ativos.has(i) ? "true" : "false"); onch();
    }}, n);
    box.append(b);
  });
  return h("div", {class: "fg"}, h("span", {class: "l"}, label), box);
}
function busca(onch) {
  const i = h("input", {type: "search", placeholder: "Buscar produto ou código…", oninput: () => onch(i.value.trim().toLowerCase())});
  return h("div", {class: "fg"}, h("label", null, "Busca"), i);
}

// ---------- dados ----------
// O "produto" do simulador é o par (filial, produto): cada filial tem o seu preço de PDV e a sua pesquisa de concorrentes.
// índice do par = filial * NPR + produto. Colunas grandes (linhas, cupons, preços de concorrentes) vêm em binário (base64).
function dec(s, T) { const bin = atob(s), n = bin.length, u = new Uint8Array(n); for (let i = 0; i < n; i++) u[i] = bin.charCodeAt(i); return new T(u.buffer); }
const FILS = D.filiais, NF = FILS.length, PROD = D.produtos, NPR = PROD.length, B = D.bin;
const P = new Array(NF * NPR);
for (let f = 0; f < NF; f++) for (let i = 0; i < NPR; i++) {
  const a = PROD[i];
  P[f * NPR + i] = {id: a[0], nome: a[1], setor: a[2], cat: a[3], f, cupons: 0, dias: 0, unid: 0, valor: 0, fora: 1, alto: 0, pdvVar: null, pdvAtac: null, custo: null};
}
for (const a of D.pares) { const p = P[a[0]]; p.cupons = a[1]; p.dias = a[2]; p.unid = a[3]; p.valor = a[4]; p.fora = a[5]; p.alto = a[6]; p.pdvVar = a[7]; p.pdvAtac = a[8]; p.custo = a[9]; }
const NC = D.concs.length;
const PC = P.map(() => []);
const CATS = [...new Set(PROD.map(a => a[3]))].sort((a, b) => a.localeCompare(b, "pt-BR"));
const catDe = Int16Array.from(PROD, a => CATS.indexOf(a[3]));
const PCAT = new Int16Array(NF * NPR);
for (let i = 0; i < PCAT.length; i++) PCAT[i] = catDe[i % NPR];
{
  const pk = dec(B.pk, Uint32Array), pc = dec(B.pc, Uint8Array), pv = dec(B.pv, Float32Array), pa = dec(B.pa, Float32Array), pt = dec(B.pt, Uint8Array), pd = dec(B.pd, Uint8Array);
  for (let i = 0; i < pk.length; i++) PC[pk[i]].push({c: pc[i], v: Math.round(pv[i] * 1e4) / 1e4, a: Math.round(pa[i] * 1e4) / 1e4, t: pt[i], dt: D.datas[pd[i]]});
}
// Moda dos preços (arredondados em centavos); empate = menor preço; sem repetição = mediana.
function moda(vs) {
  const m = new Map();
  for (const v of vs) { const k = Math.round(v * 100); m.set(k, (m.get(k) || 0) + 1); }
  let best = 0, ks = [];
  for (const [k, c] of m) { if (c > best) { best = c; ks = [k]; } else if (c === best) ks.push(k); }
  if (best > 1) return Math.min(...ks) / 100;
  const s = [...vs].sort((a, b) => a - b), n = s.length;
  return n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2;
}
// Preço de referência do mercado para o produto i: considera só preços compatíveis
// (> 0 e dentro de ±compat% do preço do PDV Mateus). crit: "moda" ou "min".
function refMercado(i, ok, crit, compat) {
  const p = P[i], out = {V: NaN, cV: -1, dV: "", A: NaN, cA: -1, dA: ""};
  for (const k of ["V", "A"]) {
    const pdv = k === "V" ? p.pdvVar : p.pdvAtac, cand = [];
    for (const r of PC[i]) {
      if (!ok(r)) continue;
      const v = k === "V" ? r.v : r.a;
      if (!(v > 0)) continue;
      if (compat && pdv > 0 && Math.abs(v / pdv - 1) > compat / 100) continue;
      cand.push({v, c: r.c, dt: r.dt});
    }
    if (!cand.length) continue;
    let ref;
    if (crit === "min") ref = Math.min(...cand.map(x => x.v)); else ref = moda(cand.map(x => x.v));
    let best = cand[0];
    for (const x of cand) if (Math.abs(x.v - ref) < Math.abs(best.v - ref)) best = x;
    out[k] = ref; out["c" + k] = best.c; out["d" + k] = best.dt;
  }
  return out;
}

// ================= SIMULADOR: UMA TABELA DINÂMICA (cupom → produtos) =================
MONTA.sim = () => {
  const pg = $("#p-sim");
  const PV = Float64Array.from(P, p => p.pdvVar == null ? NaN : p.pdvVar);
  const sinal = v => (v > 0.005 ? "+" : v < -0.005 ? "−" : "") + brl.format(Math.abs(v));
  const cls = v => v > 0.005 ? "good" : v < -0.005 ? "bad" : "";
  const qtdf = q => q % 1 ? q.toLocaleString("pt-BR", {maximumFractionDigits: 3}) : n0.format(q);
  const pdvs = [...new Set(CP.pdv)].sort((a, b) => a - b);
  const f = {conc: new Set(D.concs.map((_, i) => i)), tipo: new Set(D.tipos.map((_, i) => i)), crit: "moda", modo: "auto",
    compat: 50, desvio: 50, cob: 0, dia: "", pdv: "", q: "", grupo: "cc", ordem: "eco", ver: "todos", cats: new Set(), fil: new Set()};
  const aberto = new Set();
  let limite = 100, S = null;
  catCupFn = () => catCup(); itensCupFn = (ci, c) => itensCupCat(ci, c);
  dadosCatFn = () => f.grupo === "dia" ? dadosCatDia() : dadosCat();
  ctxCatFn = () => ({q: f.q, ordem: f.ordem === "cupom" ? "nome" : f.ordem, grupo: f.grupo});
  let RV = null, RA = null, RCV = null, RCA = null, RDV = null, RDA = null, RO = null, sigRef = "", rPc = 0, rAt = false, rCc = -1, rDt = "";

  const kp = $("#kp-sim"), tw = h("div", {class: "grid"}), aviso = h("div");
  const slider = (min, max, step, val, fmt, onch) => {
    const lab = h("span", {class: "note"}, fmt(val));
    const inp = h("input", {type: "range", min, max, step, value: val, oninput: () => { lab.textContent = fmt(+inp.value); onch(+inp.value); }});
    return [inp, lab];
  };
  const [sCompat, lCompat] = slider(0, 100, 5, 50, v => v ? "±" + v + "%" : "sem filtro", v => { f.compat = v; draw(); });
  const [sDes, lDes] = slider(0, 200, 5, 50, v => v ? "±" + v + "%" : "sem filtro", v => { f.desvio = v; draw(); });
  const [sCob, lCob] = slider(0, 100, 5, 0, v => "≥ " + v + "%", v => { f.cob = v; draw(); });
  const qin = h("input", {type: "search", placeholder: "Nº do cupom ou produto…", oninput: () => { f.q = qin.value.trim().toLowerCase(); limite = 100; draw(); }});

  // ---- faixas: itens por cupom (1 a 5 unitário) e valor do cupom (de R$ 500 em R$ 500)
  const FAIXAS_ITENS = ["1 item", "2 itens", "3 itens", "4 itens", "5 itens", "6 a 10 itens", "11 a 20 itens", "21 ou mais itens"];
  const faixaItens = n => n <= 5 ? n - 1 : n <= 10 ? 5 : n <= 20 ? 6 : 7;
  const PASSO = 500, faixaValor = v => Math.floor((v + 1e-9) / PASSO);
  const rotValor = b => "R$ " + n0.format(b * PASSO) + " a " + n0.format((b + 1) * PASSO);
  f.itB = new Set(); f.vaB = new Set();
  const boxItens = h("div", {class: "fx"}), boxValor = h("div", {class: "fx rol"});
  function alterna(set, k) { if (set.has(k)) set.delete(k); else set.add(k); limite = 100; draw(); }
  function caixa(rot, n, marcado, onch) {
    const inp = h("input", {type: "checkbox", onchange: onch}); inp.checked = marcado;
    return h("label", null, inp, h("span", null, rot), h("span", {class: "n"}, n0.format(n)));
  }
  function pintaFaixas(cI, cV) {
    boxItens.replaceChildren(...FAIXAS_ITENS.map((rot, i) => caixa(rot, cI[i] || 0, f.itB.has(i), () => alterna(f.itB, i))));
    const bs = [...new Set([...Object.keys(cV).map(Number), ...f.vaB])].sort((x, y) => x - y);
    boxValor.replaceChildren(...bs.map(bk => caixa(rotValor(bk), cV[bk] || 0, f.vaB.has(bk), () => alterna(f.vaB, bk))));
  }
  // filial: sem marcação = todas
  const msgFil = "Sem marcação = todas as filiais.";
  const infoFil = h("p", {class: "note"}, msgFil), boxFil = h("div", {class: "fx"});
  const filLabels = FILS.map((fl, i) => {
    const inp = h("input", {type: "checkbox", onchange: () => {
      if (inp.checked) f.fil.add(i); else f.fil.delete(i);
      infoFil.textContent = f.fil.size ? n0.format(f.fil.size) + " filial(is) marcada(s)" : msgFil;
      limite = 100; draw();
    }});
    const l = h("label", null, inp, h("span", null, fl.curto), h("span", {class: "n"}, n0.format(fl.cupons))); l.cb = inp; return l;
  });
  boxFil.append(...filLabels);
  const limpaFil = () => { f.fil.clear(); for (const l of filLabels) l.cb.checked = false; infoFil.textContent = msgFil; limite = 100; draw(); };
  // categoria (dim_produto): lista com busca; sem marcação = todas
  const msgCat = "Sem marcação = todas as categorias.";
  const infoCat = h("p", {class: "note"}, msgCat), boxCat = h("div", {class: "fx rol"});
  const catLabels = CATS.map((nm, i) => {
    const inp = h("input", {type: "checkbox", onchange: () => {
      if (inp.checked) f.cats.add(i); else f.cats.delete(i);

      limite = 100; draw();
    }});

  });
  boxCat.append(...catLabels);
  const qcat = h("input", {type: "search", placeholder: "Buscar categoria…", oninput: () => {
    const q = qcat.value.trim().toLowerCase();
    for (const l of catLabels) l.hidden = !!q && !l.dataset.n.includes(q);
  }});
  const limpaCat = () => { f.cats.clear(); for (const l of catLabels) l.cb.checked = false; infoCat.textContent = msgCat; limite = 100; draw(); };
  const limpar = () => { f.itB.clear(); f.vaB.clear(); limite = 100; draw(); };

  // ---- menu lateral (recolhe ao clicar em "Filtros")
  const grupo = (titulo, ...itens) => h("details", {open: ""}, h("summary", null, titulo), ...itens);
  const campo = (rot, ...c) => h("div", {class: "fg"}, h("label", null, rot), ...c);
  const aside = h("aside", {class: "drawer", role: "dialog", "aria-label": "Menu de filtros"},
    h("div", {class: "fechar"}, h("button", {type: "button", onclick: () => menu(false)}, "Fechar Menu ", h("span", null, "›"))),
    grupo("Filial", infoFil, boxFil, h("button", {class: "chip", type: "button", onclick: limpaFil}, "Limpar filiais")),
    grupo("Concorrentes e preço",
      chips("Concorrentes considerados", D.concs, f.conc, draw),
      chips("Tipo de preço do concorrente", D.tipos, f.tipo, draw),
      sel("Preço do mercado", CRITERIOS, v => { f.crit = v; draw(); }).el,
      sel("Tabela de preço", [["auto", "Automática (conforme a venda)"], ["var", "Sempre varejo"], ["atac", "Sempre atacado"]], v => { f.modo = v; draw(); }).el,
      campo("Preço do concorrente compatível com o PDV em", sCompat, lCompat),
      campo("Ignorar itens vendidos fora de", sDes, lDes)),
    grupo("Cupons",
      campo("Busca", qin),
      sel("Dia", [["", "Todos os dias"], ...D.dias.map((d, i) => [String(i), d])], v => { f.dia = v; limite = 100; draw(); }).el,
      sel("PDV", [["", "Todos os PDVs"], ...pdvs.map(x => [String(x), String(x)])], v => { f.pdv = v; limite = 100; draw(); }).el,
      sel("Mostrar", [["todos", "Todos os cupons"], ["pos", "Só onde o Mateus foi mais barato (+)"], ["neg", "Só onde o Mateus foi mais caro (−)"]], v => { f.ver = v; limite = 100; draw(); }).el,
      campo("Cobertura mínima do cupom", sCob, lCob)),
    grupo("Itens por cupom", h("p", {class: "note"}, "Itens comparados. Sem marcação = todos."), boxItens),
    grupo("Valor do cupom (R$ 500 em R$ 500)", h("p", {class: "note"}, "Valor dos itens comparados. Sem marcação = todos."), boxValor),
    grupo("Categoria", infoCat, campo("Buscar categoria", qcat), boxCat, h("button", {class: "chip", type: "button", onclick: limpaCat}, "Limpar categorias")),
    grupo("Exibição",
      sel("Agrupar", [["cc", "Cupom → Categoria → Produtos"], ["cup", "Cupom → Produtos"], ["dia", "Dia → Cupom → Categoria → Produtos"], ["cat", "Categoria → Cupom → Produtos"]], v => { f.grupo = v; limite = 100; draw(); }).el,
      sel("Ordenar por", [["eco", "Melhor resultado do Mateus (+)"], ["pior", "Pior resultado do Mateus (−)"], ["valor", "Maior valor do cupom"], ["cupom", "Cupom / dia"]], v => { f.ordem = v; draw(); }).el),
    h("button", {class: "chip", type: "button", onclick: limpar}, "Limpar faixas"));

  const nota = (h("p", {class: "note"}, "Como ler: cada cupom mostra a nossa venda, quanto aquela mesma compra custaria no concorrente e a economia = venda no concorrente − nossa venda. Valor positivo (+, verde) = o Mateus foi mais barato; negativo (−, vermelho) = o Mateus foi mais caro que o concorrente. O preço do concorrente é a moda do mercado (preço mais comum entre os concorrentes selecionados; se nenhum se repete, a mediana) ou o menor preço, à sua escolha. Preços de concorrente ≤ 0 ou fora da faixa de compatibilidade com o preço do PDV Mateus são descartados. Produtos sem pesquisa, com pesquisa em branco (sem preço do concorrente) ou vendidos fora da faixa de preço não aparecem no cupom e não entram no cálculo: os valores do cupom são só dos itens comparados. Cada item mostra o concorrente cujo preço foi usado (o mais próximo da referência do mercado) e a data da pesquisa. Cobertura = % do valor do cupom que pôde ser comparado (use o filtro Cobertura mínima para esconder cupons pouco comparados). A linha TOTAL GERAL, fixa no rodapé da tabela, soma todos os cupons filtrados."));

  // botões da barra: hambúrguer (abre o menu lateral) e setas pequenas

    const d = conc - pago;
    const tg = h("span", {class: "tg"}, chave ? (aberto.has(chave) ? "▼" : "▶") : "");
    const r = h("tr", {class: cl + (chave ? " clk" : "")},
      h("td", {style: "padding-left:" + (12 + nivel * 20) + "px"}, tg, rot),
      cel(cupons == null ? "" : n0.format(cupons), 1), cel(qtd, 1), cel(pu, 1), cel(puc, 1), cel(cn, 0), cel(dt, 0),
      cel(brl.format(pago), 1), cel(brl.format(conc), 1), cel(h("span", {class: cls(d)}, sinal(d)), 1), cel(h("span", {class: cls(d)}, pago ? pct(d / pago) : "–"), 1));
    if (chave) r.addEventListener("click", () => { if (aberto.has(chave)) aberto.delete(chave); else aberto.add(chave); render(); });
    return r;
  }

  function render() {
    const q = fc.q, cmp = {eco: (a, b) => (b.conc - b.pago) - (a.conc - a.pago), pior: (a, b) => (a.conc - a.pago) - (b.conc - b.pago), valor: (a, b) => b.pago - a.pago};
    const nomeProd = pr => P[pr.pi].id + " · " + P[pr.pi].nome;
    const ordP = ps => ps.slice().sort(fc.ordem === "nome" ? (a, b) => nomeProd(a).localeCompare(nomeProd(b), "pt-BR") : cmp[fc.ordem]);
    const ordC = cs => cs.sort(fc.ordem === "nome" ? (a, b) => a.nome.localeCompare(b.nome, "pt-BR") : cmp[fc.ordem]);
    const filtra = lista => {                                   // nomeia as categorias e aplica a busca
      const cs = lista.map(g => ({...g, nome: CATS[g.c]}));
      if (!q) return cs;
      return cs.map(g => {
        const catOk = g.nome.toLowerCase().includes(q);
        const prods = catOk ? g.prods : g.prods.filter(pr => nomeProd(pr).toLowerCase().includes(q));
        return prods.length ? {...g, prods} : null;
      }).filter(Boolean);
    };
    const grupo = fc.grupo, tb = h("tbody"), chaves = [];
    const mapCup = grupo === "cat" ? new Map(catCupFn().map(x => [x.c, x])) : null;
    const linhasCups = (g, nivel, k) => {                        // Categoria → Cupom → Produtos
      let cs = (mapCup.get(g.c) || {cs: []}).cs.slice();
      if (q && !g.nome.toLowerCase().includes(q)) cs = cs.filter(x => itensCupFn(x.ci, g.c).some(it => nomeProd(it).toLowerCase().includes(q)));
      cs.sort(fc.ordem === "nome" ? (a, b) => a.ci - b.ci : cmp[fc.ordem]);
      const lim = maisCup.get(k) || 100;
      for (const x of cs.slice(0, lim)) {
        const kc = k + "#" + x.ci;
        tb.append(tr(nivel, kc, rotCupom(x.ci), null, x.n + (x.n === 1 ? " item" : " itens"), "", "", "", "", x.pago, x.conc, "g1"));
        if (aberto.has(kc)) for (const it of itensCupFn(x.ci, g.c).sort((a, b) => (b.conc - b.pago) - (a.conc - a.pago)))
          tb.append(tr(nivel + 1, null, nomeProd(it), null, qtdf(it.q), n2.format(it.pago / it.q), n2.format(it.conc / it.q), it.cn, it.dt, it.pago, it.conc, "it"));
      }
      if (cs.length > lim) tb.append(h("tr", null, h("td", {colspan: 11, class: "empty"}, "Mostrando " + n0.format(lim) + " de " + n0.format(cs.length) + " cupons desta categoria. ",
        h("button", {class: "chip", type: "button", onclick: () => { maisCup.set(k, lim + 100); render(); }}, "Mostrar mais 100"))));
    };
    const linhasProd = (ps, nivel) => {
      for (const pr of ordP(ps).slice(0, 200)) tb.append(tr(nivel, null, nomeProd(pr), pr.ncup, qtdf(pr.q), n2.format(pr.pago / pr.q), n2.format(pr.conc / pr.q), pr.cn, pr.dt, pr.pago, pr.conc, "it"));
      if (ps.length > 200) tb.append(h("tr", null, h("td", {colspan: 11, class: "empty"}, "Mostrando 200 de " + n0.format(ps.length) + " produtos. Use a busca para localizar um produto.")));
    };
    const linhasCat = (g, nivel, pre) => {
      const k = pre + g.c;
      tb.append(tr(nivel, k, g.nome, g.ncup, n0.format(g.prods.length) + (g.prods.length === 1 ? " produto" : " produtos"), "", "", "", "", g.pago, g.conc, nivel ? "gc" : "g0"));
      if (aberto.has(k)) { if (grupo === "cat") linhasCups(g, nivel + 1, k); else linhasProd(g.prods, nivel + 1); }
    };
    let total, rotTot, tp, tcn, nTopo;
    if (grupo === "dia") {                                      // Dia → Categoria → Produtos
      let dias = dados.map(g => ({...g, cats: filtra(g.cats)})).filter(g => g.cats.length);
      dias.sort(fc.ordem === "nome" ? (a, b) => a.d - b.d : cmp[fc.ordem]);
      nTopo = dias.length;
      for (const g of dias.slice(0, limite)) {
        const k = "d:" + g.d;
        chaves.push(k); for (const c of g.cats) chaves.push(k + "#k:" + c.c);
        tb.append(tr(0, k, "Dia " + D.dias[g.d], g.ncup, n0.format(g.cats.length) + (g.cats.length === 1 ? " categoria" : " categorias"), "", "", "", "", g.pago, g.conc, "g0"));
        if (aberto.has(k)) for (const c of ordC(g.cats)) linhasCat(c, 1, k + "#k:");
      }
      tp = dados.reduce((s2, g) => s2 + g.pago, 0); tcn = dados.reduce((s2, g) => s2 + g.conc, 0);
      rotTot = "TOTAL GERAL · " + n0.format(dados.length) + " dias"; total = "dias";
    } else if (grupo === "cup") {                               // Produtos (sem nível de categoria)
      const ps = ordP(filtra(dados).flatMap(g => g.prods));
      nTopo = ps.length;
      for (const pr of ps.slice(0, limite)) tb.append(tr(0, null, nomeProd(pr), pr.ncup, qtdf(pr.q), n2.format(pr.pago / pr.q), n2.format(pr.conc / pr.q), pr.cn, pr.dt, pr.pago, pr.conc, "it"));
      tp = dados.reduce((s2, g) => s2 + g.pago, 0); tcn = dados.reduce((s2, g) => s2 + g.conc, 0);
      rotTot = "TOTAL GERAL · " + n0.format(dados.reduce((s2, g) => s2 + g.prods.length, 0)) + " produtos"; total = "produtos";
    } else {                                                    // Categoria → Produtos
      const cats = ordC(filtra(dados));
      nTopo = cats.length;
      for (const g of cats.slice(0, limite)) { chaves.push("k:" + g.c); linhasCat(g, 0, "k:"); }
      tp = dados.reduce((s2, g) => s2 + g.pago, 0); tcn = dados.reduce((s2, g) => s2 + g.conc, 0);
      rotTot = "TOTAL GERAL · " + n0.format(dados.length) + " categorias"; total = "categorias";
    }
    const tf = h("tfoot", null, tr(0, null, rotTot, null, "", "", "", "", "", tp, tcn, "tot"));
    const cab = [grupo === "dia" ? "Dia / Categoria / Produto" : grupo === "cup" ? "Produto" : grupo === "cat" ? "Categoria / Cupom / Produto" : "Categoria / Produto", "Cupons", "Qtd", "Preço unit. Mateus", "Preço unit. concorrente", "Concorrente", "Data da pesquisa", "Nossa venda", "Venda no concorrente", "Economia (R$)", "%"];
    const st = wrap.scrollTop, sl = wrap.scrollLeft;
    wrap.replaceChildren(h("table", {class: "t"}, h("thead", null, h("tr", null, cab.map((c, i) => h("th", {class: [1, 2, 3, 4, 7, 8, 9, 10].includes(i) ? "r" : ""}, c)))), tb, tf));
    wrap.scrollTop = st; wrap.scrollLeft = sl;
    info.textContent = n0.format(nTopo) + " " + total;
    maisC.replaceChildren(...(nTopo > limite ? [h("div", {class: "note"}, "Mostrando " + n0.format(limite) + " de " + n0.format(nTopo) + " " + total + ". ",
      h("button", {class: "chip", type: "button", onclick: () => { limite += 100; render(); }}, "Mostrar mais 100"))] : []));
    wrap._chaves = chaves;
  }

  const barra = h("div", {class: "barra"},
    h("button", {class: "chip hb", type: "button", "aria-label": "Abrir menu de filtros", onclick: () => menuFn && menuFn(true)}, h("span", {class: "hamb"}), "Filtros"),
    seta("▼", "Expandir tudo", () => { for (const k of wrap._chaves || []) aberto.add(k); render(); }),
    seta("▲", "Recolher tudo", () => { aberto.clear(); render(); }), info);
  const btnCheiaC = h("button", {class: "chip", type: "button", "aria-pressed": "false"}, "⛶ Tela cheia");
  const hambC = () => h("button", {class: "chip hb", type: "button", "aria-label": "Abrir menu de filtros", onclick: () => menuFn && menuFn(true)}, h("span", {class: "hamb"}), "Filtros");
  const cardC = h("div", {class: "card"},
    h("div", {class: "cardhead"}, h("div", null, h("h2", null, "Categoria → Produtos"), h("p", {class: "sub"}, "Preços, concorrente e data da pesquisa por categoria. Acompanha todos os filtros do menu (concorrentes, preço do mercado, busca, dia, PDV, faixas, categorias, agrupamento e ordenação). Agrupar: “Cupom → Categoria…” = Categoria → Produtos; “Cupom → Produtos” = só produtos; “Dia → …” = Dia → Categoria → Produtos; “Categoria → Cupom → Produtos” = categoria, depois os cupons dela e os produtos. Economia (R$) = venda no concorrente − nossa venda: positivo (+) = Mateus mais barato; negativo (−) = Mateus mais caro.")),
      h("div", {class: "cardbtns"}, hambC(), btnCheiaC)),
    h("div", {class: "body"}, wrap, maisC));
  function cheiaC(on) {
    cardC.classList.toggle("cheia", on); cardC.classList.toggle("cheia-cat", on); document.body.classList.toggle("sem-rolagem", on);
    btnCheiaC.textContent = on ? "✕ Sair da tela cheia" : "⛶ Tela cheia"; btnCheiaC.setAttribute("aria-pressed", on ? "true" : "false");
  }
  btnCheiaC.addEventListener("click", () => cheiaC(!cardC.classList.contains("cheia")));
  document.addEventListener("keydown", e => { if (e.key === "Escape" && cardC.classList.contains("cheia")) cheiaC(false); });
  pg.append(h("div", {class: "grid"}, barra, cardC));
  hookCat = () => { const c = ctxCatFn(); fc.q = (c.q || "").toLowerCase(); fc.ordem = c.ordem; fc.grupo = c.grupo; dados = dadosCatFn(); render(); };
  hookCat();
};

abrir(ABAS.some(a => a[0] === location.hash.slice(1)) ? location.hash.slice(1) : "sim");
</script>
</body>
</html>
